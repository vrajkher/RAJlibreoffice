name: LibreOffice MCP tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice libreoffice-dev python3-uno libreoffice-sdbc-firebird
      - run: python -m pip install -e '.[dev]' 'mcp>=1.29,<2'
      - run: python -m unittest discover -s tests -v
      - run: raj-libreoffice doctor
  openai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[openai,dev]'
      - run: python -m unittest discover -s tests -v

